# Four synthetic examples, NOT an official benchmark or model quality result.
# Use --backend mock for offline generation; scoring is entirely rule based.
version: 1
suite: synthetic-interface-demo
bank: ../../examples/eval/demo_bank.jsonl
dataset:
  name: synthetic-interface-demo
  revision: demo-v1
  split: demo
  expected_counts:
    demo_choice: 2
    demo_exact: 2
model:
  revision: mock-v1
  base_url_env: BENCHMARK_BASE_URL
  model_env: BENCHMARK_MODEL
  api_key_env: BENCHMARK_API_KEY
  api_key_required: true
generation:
  max_tokens: 128
  temperature: 0.0
samples: 1
subset:
  seed: 20261024
  stratify_by: stratum
  counts:
    demo_choice: 1
    demo_exact: 1
benchmarks:
  demo_choice:
    scorer:
      type: multiple_choice
  demo_exact:
    scorer:
      type: exact_match
