# 最小可行配置：只保留有论文直接支撑、且不需要额外 LLM agent 的环节。
# 用法：python -m datapipe run --config configs/minimal.yaml --input ... --out ...
# 依据见 ../依据核对与最小方案.md
run_name: minimal
dedup:
  minhash: {enabled: false}      # 训练集内部近重复：只做精确去重
  embedding: {enabled: false}
decontam_split:
  ngram: {n: 13, min_shared: 1}  # 对评测集去污染保留
  embedding: {enabled: true, threshold: 0.9}
verifier_review:
  enabled: true
  n_solutions: 4                 # CodeMidas 每题 4 次解答
  lint: {enabled: false}         # 正则检查测试写死，没有出处，关掉
leak_check:
  enabled: true                  # 清理 + 复查参考答案 + grep 找残留答案（不用 LLM agent）
  shortcut_attempts: 1
difficulty:
  enabled: false                 # 仍是插件；打开时按下面的单轮规则
  initial_samples: 8             # 一次采 8 次
  mid_total: 8
  zero_escalation: []            # 不再追加到 16-32 次
  anchor_fraction: 0.0
  all_correct_action: drop       # 全对：丢弃
  unsolved_action: teacher_demo  # 全错：交给教师示范
trajectory:
  keep_per_task: 1
