[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "datapipe"
version = "0.2.1"
description = "SFT + RL data pipeline: download, dedup / decontamination, execution checks, verl export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml", "numpy", "pyarrow", "jsonschema>=4.18"]

[project.optional-dependencies]
hf = ["datasets", "huggingface_hub"]
embed = ["sentence-transformers"]
code = ["sortedcontainers"]          # LeetCode reference solutions import it
dev = ["sortedcontainers"]

[project.scripts]
datapipe = "datapipe.cli:main"

[tool.setuptools.packages.find]
include = ["datapipe*"]

[tool.setuptools.package-data]
datapipe = ["defaults.yaml"]
