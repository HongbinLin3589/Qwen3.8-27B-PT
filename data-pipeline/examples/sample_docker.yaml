# Same sample, but SWE tasks run in real Docker containers (one fresh
# container per run, network off). Needs a running Docker daemon and the
# python:3.12-slim image.
run_name: sample-docker
workers: 4
backends:
  sandbox: {type: docker, network: false}
decontam_split:
  eval_sets: [sample/eval/eval_set.jsonl]
verifier_review:
  n_solutions: 4
  audit_per_source: 5
trajectory:
  n_per_task: 2
dedup:
  embedding: {threshold: 0.85}
