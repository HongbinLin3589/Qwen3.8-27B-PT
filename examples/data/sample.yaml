# Small local run: mock models, local sandbox. Deep-merged over src/qwenpt/data/defaults.yaml.
run_name: sample
workers: 4
decontam_split:
  eval_sets: [sample/eval/eval_set.jsonl]
verifier_review:
  n_solutions: 4
  audit_per_source: 5
trajectory:
  n_per_task: 2
dedup:
  # The local hashing embedder scores lower than a real embedding model, so
  # its threshold is lower here. Re-tune with your production embedder.
  embedding: {threshold: 0.85}
